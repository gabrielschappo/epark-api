<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-PARK PRO - Gestão de Estacionamento</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row">
            
            <nav class="col-md-2 d-none d-md-block bg-dark text-white sidebar min-vh-100 p-3">
                <div class="d-flex align-items-center mb-4">
                    <h4 class="m-0 text-primary fw-bold">🚗 E-PARK PRO</h4>
                </div>
                <hr>
                <ul class="nav flex-column mb-auto">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link text-white bg-primary bg-opacity-25 rounded">📊 Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="gerenciar-vagas.html" class="nav-link text-white text-opacity-75">🅿️ Gerenciar Vagas</a>
                    </li>
                    <li class="nav-item">
                        <a href="relatorios.html" class="nav-link text-white text-opacity-75">📈 Relatórios</a>
                    </li>
                </ul>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4 pt-3">
                
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                    <h1 class="h2">Mapa de Vagas - Setor A1 (Subsolo)</h1>
                </div>

                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card shadow-sm">
                            <div class="card-body text-center">
                                <h6 class="card-title text-muted">Vagas Totais</h6>
                                <h2 class="card-text fw-bold" id="txt-vagas-totais">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm">
                            <div class="card-body text-center">
                                <h6 class="card-title text-muted">Ocupadas</h6>
                                <h2 class="card-text fw-bold" id="txt-vagas-ocupadas">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm border-success">
                            <div class="card-body text-center">
                                <h6 class="card-title text-success">Livres</h6>
                                <h2 class="card-text fw-bold text-success" id="txt-vagas-livres">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm">
                            <div class="card-body text-center">
                                <h6 class="card-title text-muted">Especiais</h6>
                                <h2 class="card-text fw-bold" id="txt-vagas-especiais">0</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded shadow-sm border">
                    <div class="row" id="grid-vagas">
                        </div>
                </div>

            </main>
        </div>
    </div>

    <div class="offcanvas offcanvas-end shadow" tabindex="-1" id="painelVaga" aria-labelledby="painelVagaLabel">
        <div class="offcanvas-header border-bottom bg-light">
            <h5 class="offcanvas-title fw-bold" id="painelVagaLabel">Detalhes da Vaga</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body" id="conteudoPainelVaga">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/app.js"></script>
</body>
</html>
